<!-- @dsCard group="Colors" viewport="700x150" subtitle="Semantic roles: text, surface, rule, accent" name="Semantic roles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pm-font-sans);background:#fff}
.row{display:flex;gap:14px;padding:20px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:72px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.lbl{font-size:10px;letter-spacing:1px;color:var(--pm-ink-500);text-transform:uppercase}
.hex{font-size:10px;color:var(--pm-ink-400)}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--pm-text-strong)"></div><div class="lbl">text-strong</div><div class="hex">ink-900</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-text-body)"></div><div class="lbl">text-body</div><div class="hex">ink-500</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-text-muted)"></div><div class="lbl">text-muted</div><div class="hex">ink-400</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-border)"></div><div class="lbl">border</div><div class="hex">ink-200</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-accent)"></div><div class="lbl">accent</div><div class="hex">ink-900</div></div>
</div></body></html>
