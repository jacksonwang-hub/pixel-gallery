<!-- @dsCard group="Colors" viewport="700x150" subtitle="Monochrome ink scale, 50→900" name="Ink / neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pm-font-sans);background:#fff}
.row{display:flex;gap:0;padding:20px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:64px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.lbl{font-size:10px;letter-spacing:1px;color:var(--pm-ink-500);text-transform:uppercase}
.hex{font-size:10px;color:var(--pm-ink-400)}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--pm-ink-50)"></div><div class="lbl">50</div><div class="hex">#fafafa</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-100)"></div><div class="lbl">100</div><div class="hex">#f2f2f2</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-200)"></div><div class="lbl">200</div><div class="hex">#e4e4e4</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-300)"></div><div class="lbl">300</div><div class="hex">#cfcfcf</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-400)"></div><div class="lbl">400</div><div class="hex">#9a9a9a</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-500)"></div><div class="lbl">500</div><div class="hex">#6e6e6e</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-700)"></div><div class="lbl">700</div><div class="hex">#2a2a2a</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-ink-900)"></div><div class="lbl">900</div><div class="hex">#111111</div></div>
</div></body></html>
