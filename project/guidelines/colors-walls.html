<!-- @dsCard group="Colors" viewport="700x150" subtitle="Wall & floor environment tones" name="Walls & floor" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pm-font-sans);background:#fff}
.row{display:flex;gap:14px;padding:20px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:80px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.lbl{font-size:10px;letter-spacing:1px;color:var(--pm-ink-500);text-transform:uppercase}
.hex{font-size:10px;color:var(--pm-ink-400)}</style></head>
<body><div class="row">
<div class="sw"><div class="chip" style="background:var(--pm-wall-white)"></div><div class="lbl">Wall · White</div><div class="hex">#ffffff</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-wall-bone)"></div><div class="lbl">Wall · Bone</div><div class="hex">#f6f4ef</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-wall-cool)"></div><div class="lbl">Wall · Cool</div><div class="hex">#f4f6f7</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-floor)"></div><div class="lbl">Floor</div><div class="hex">#efeeea</div></div>
<div class="sw"><div class="chip" style="background:var(--pm-floor-edge)"></div><div class="lbl">Floor edge</div><div class="hex">#e0ded8</div></div>
</div></body></html>
