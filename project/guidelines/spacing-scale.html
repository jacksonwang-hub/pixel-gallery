<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base spacing scale" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--pm-font-sans);background:#fff;padding:22px}
.row{display:flex;align-items:flex-end;gap:18px}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bar{background:var(--pm-ink-900);height:18px}
.lbl{font-size:10px;letter-spacing:1px;color:var(--pm-ink-500);text-transform:uppercase}</style></head>
<body><div class="row">
<div class="col"><div class="bar" style="width:4px"></div><div class="lbl">1·4</div></div>
<div class="col"><div class="bar" style="width:8px"></div><div class="lbl">2·8</div></div>
<div class="col"><div class="bar" style="width:12px"></div><div class="lbl">3·12</div></div>
<div class="col"><div class="bar" style="width:16px"></div><div class="lbl">4·16</div></div>
<div class="col"><div class="bar" style="width:22px"></div><div class="lbl">5·22</div></div>
<div class="col"><div class="bar" style="width:28px"></div><div class="lbl">6·28</div></div>
<div class="col"><div class="bar" style="width:40px"></div><div class="lbl">8·40</div></div>
<div class="col"><div class="bar" style="width:64px"></div><div class="lbl">10·64</div></div>
</div></body></html>
