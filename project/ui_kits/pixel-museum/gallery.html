<!-- @dsCard group="Pixel Museum" viewport="1280x720" subtitle="Gallery wall — arrow-key navigation" name="Pixel Museum — gallery" -->
<!-- @startingPoint section="Pixel Museum" subtitle="White-cube gallery wall" viewport="1280x800" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--pm-font-sans);color:var(--pm-text-strong);background:var(--pm-wall-white);overflow:hidden}
  img{image-rendering:pixelated}
  .bar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fff;border-bottom:1px solid var(--pm-border);z-index:10}
  .wm{font-size:13px;font-weight:700;letter-spacing:5px}
  .seg{display:flex;gap:2px;border:1px solid var(--pm-border)}
  .seg button{font-family:var(--pm-font-sans);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:11px 22px;border:none;cursor:pointer}
  .on{background:var(--pm-accent);color:#fff}.off{background:#fff;color:var(--pm-text-body)}
  .floor{position:fixed;bottom:0;left:0;right:0;height:104px;background:var(--pm-floor);box-shadow:inset 0 1px 0 var(--pm-floor-edge)}
  .base{position:fixed;bottom:104px;left:0;right:0;height:1px;background:var(--pm-ink-200)}
  .wall{position:absolute;inset:64px 0 0 0;display:flex;align-items:center;gap:96px;padding:0 80px}
  .slot{flex:none;display:flex;flex-direction:column;align-items:center;transform-origin:center}
  .frame{position:relative;background:#fff;padding:3px;box-shadow:var(--pm-frame-rule),var(--pm-shadow-frame)}
  .spot{position:absolute;left:50%;top:-150px;transform:translateX(-50%);width:160px;height:150px;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,0));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);pointer-events:none}
  .mat{width:100%;height:100%;background:#fff;padding:22px}
  .well{width:100%;height:100%;overflow:hidden;box-shadow:0 0 0 1px var(--pm-ink-300);background:var(--pm-surface-fill)}
  .well svg{display:block;width:100%;height:100%}
  .pt{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:20px}
  .pc{font-size:12px;color:var(--pm-text-muted);margin-top:3px}
  .title{flex:none;display:flex;flex-direction:column;align-items:center;padding-bottom:40px}
  .eyebrow{font-size:13px;letter-spacing:5px;color:var(--pm-ink-400);text-transform:uppercase}
  .disp{font-size:84px;font-weight:700;letter-spacing:-3px;line-height:.95;margin-top:14px}
  .rule{width:44px;height:2px;background:#111;margin-top:24px}
  .hint{font-size:15px;color:var(--pm-ink-400);margin-top:18px}
  .walker{position:fixed;bottom:102px;left:50%;transform:translateX(-50%);z-index:5}
  .walker img{height:150px;width:auto;display:block}
  .shadow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);height:8px;width:42px;border-radius:50%;background:rgba(0,0,0,.14)}
  .hud{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:28px;align-items:center;background:#fff;padding:14px 24px;border:1px solid var(--pm-border);box-shadow:var(--pm-shadow-hud)}
  .grp{display:flex;align-items:center;gap:10px}
  .keys{display:flex;gap:4px}
  .cap{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--pm-ink-300);border-radius:4px}
  .klbl{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--pm-text-body);text-transform:uppercase}
</style></head>
<body>
  <div class="bar"><div class="wm">PIXEL&nbsp;PIX</div>
    <div class="seg"><button class="off">Curate</button><button class="on">Gallery</button></div></div>
  <div class="base"></div><div class="floor"></div>

  <div class="wall">
    <div class="title">
      <div class="eyebrow">Exhibition</div>
      <div class="disp" style="white-space:nowrap">Pixel Pix</div>
      <div class="rule"></div>
      <div class="hint">use &larr; &rarr; to walk the room</div>
    </div>

    <!-- landscape, focused -->
    <div class="slot" style="transform:scale(1.06)">
      <div class="frame" style="width:350px;height:240px"><div class="spot"></div><div class="mat"><div class="well" id="w1"></div></div></div>
      <div class="pt">Photo 01</div><div class="pc">archival pixel print</div>
    </div>

    <!-- portrait -->
    <div class="slot" style="transform:scale(.84);opacity:.55">
      <div class="frame" style="width:230px;height:330px"><div class="mat"><div class="well" id="w2"></div></div></div>
      <div class="pt">Photo 02</div><div class="pc">archival pixel print</div>
    </div>

    <!-- square -->
    <div class="slot" style="transform:scale(.84);opacity:.55">
      <div class="frame" style="width:300px;height:300px"><div class="mat"><div class="well" id="w3"></div></div></div>
      <div class="pt">Photo 03</div><div class="pc">archival pixel print</div>
    </div>
  </div>

  <div class="walker"><img src="../../character.png" alt="gallery visitor"><div class="shadow"></div></div>

  <div class="hud">
    <div class="grp"><div class="keys">
      <div class="cap"><div style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:9px solid #111"></div></div>
      <div class="cap"><div style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #111"></div></div>
    </div><div class="klbl">Walk</div></div>
    <div class="grp"><div class="cap"><div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid #111"></div></div><div class="klbl">Zoom</div></div>
    <div class="grp"><div class="cap"><div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #111"></div></div><div class="klbl">Back</div></div>
  </div>

  <script>
    const sky=(p,ratio)=>`<svg viewBox="0 0 ${ratio} 16" shape-rendering="crispEdges" preserveAspectRatio="none"><rect x="0" y="0" width="${ratio}" height="9" fill="${p[1]}"/><rect x="0" y="6" width="${ratio}" height="3" fill="${p[2]}"/><rect x="${ratio-5}" y="2" width="3" height="3" fill="#f3d77a"/><rect x="0" y="9" width="${ratio}" height="7" fill="${p[3]}"/><rect x="${Math.round(ratio*0.45)}" y="10" width="${ratio}" height="6" fill="${p[0]}"/></svg>`;
    document.getElementById('w1').innerHTML=sky(['#244b73','#5b7aa8','#d98a64','#2c3e57'],24);
    document.getElementById('w2').innerHTML=sky(['#3a3550','#7d6a99','#c98aa0','#241f33'],11);
    document.getElementById('w3').innerHTML=sky(['#2f5141','#6f9c7d','#e0c08a','#1d3328'],16);
  </script>
</body></html>
