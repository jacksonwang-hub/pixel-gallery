<!-- @dsCard group="Components" viewport="700x180" subtitle="Primary, ghost, disabled, with arrow" name="Buttons & toggle" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--pm-font-sans);background:#fff;padding:26px;display:flex;flex-direction:column;gap:22px}
.b{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:15px 26px;border:none;cursor:pointer}
.primary{background:var(--pm-accent);color:#fff}
.ghost{background:#fff;color:var(--pm-text-strong);box-shadow:inset 0 0 0 1px var(--pm-border)}
.disabled{background:var(--pm-surface-fill);color:var(--pm-text-muted)}
.tri{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:9px solid #fff}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;border:1px solid var(--pm-border);width:max-content}
.seg button{font-family:var(--pm-font-sans);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:11px 22px;border:none;cursor:pointer}
.on{background:var(--pm-accent);color:#fff}.off{background:#fff;color:var(--pm-text-body)}</style></head>
<body>
<div class="row">
<button class="b primary">Ship it <span class="tri"></span></button>
<button class="b ghost">Cancel</button>
<button class="b disabled">Ship it</button>
</div>
<div class="seg"><button class="on">Curate</button><button class="off">Gallery</button></div>
</body></html>
