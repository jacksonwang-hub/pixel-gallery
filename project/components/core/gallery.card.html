<!-- @dsCard group="Components" viewport="700x340" subtitle="Art frame, plaque & nav keycaps" name="Frame, plaque & keycaps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--pm-font-sans);background:var(--pm-wall-white);padding:28px;display:flex;gap:40px;align-items:center}
.frame{width:200px;height:200px;background:#fff;padding:3px;box-shadow:var(--pm-frame-rule),var(--pm-shadow-frame)}
.mat{width:100%;height:100%;background:#fff;padding:16px}
.well{width:100%;height:100%;box-shadow:0 0 0 1px var(--pm-ink-300);overflow:hidden}
.well svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.plaque-t{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--pm-text-strong);margin-top:16px;text-align:center}
.plaque-c{font-size:12px;color:var(--pm-text-muted);text-align:center;margin-top:3px}
.keys{display:flex;gap:8px}
.cap{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--pm-ink-300);border-radius:4px}
.lbl{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--pm-text-body);text-transform:uppercase;margin-top:10px}
.grp{display:flex;flex-direction:column;align-items:center}</style></head>
<body>
<div>
<div class="frame"><div class="mat"><div class="well">
<svg viewBox="0 0 16 16" shape-rendering="crispEdges" preserveAspectRatio="none">
<rect x="0" y="0" width="16" height="9" fill="#5b7aa8"/><rect x="0" y="6" width="16" height="3" fill="#d98a64"/>
<rect x="10" y="2" width="3" height="3" fill="#f3d77a"/><rect x="0" y="9" width="16" height="7" fill="#2c3e57"/>
<rect x="7" y="10" width="9" height="6" fill="#395270"/></svg>
</div></div></div>
<div class="plaque-t">Photo 01</div><div class="plaque-c">archival pixel print</div>
</div>
<div style="display:flex;gap:28px">
<div class="grp"><div class="keys"><div class="cap"><div style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:9px solid #111"></div></div><div class="cap"><div style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #111"></div></div></div><div class="lbl">Walk</div></div>
<div class="grp"><div class="cap"><div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid #111"></div></div><div class="lbl">Zoom</div></div>
<div class="grp"><div class="cap"><div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #111"></div></div><div class="lbl">Back</div></div>
</div>
</body></html>
